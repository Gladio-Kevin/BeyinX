<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="BeyinX - Yapay zeka sohbet uygulaması">
<link rel="manifest" href="/manifest.json">
<title>BeyinX</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,sans-serif;
height:100vh;
overflow:hidden;
color:#171827;
background:
radial-gradient(circle at 20% 10%,#e8eaff 0,transparent 35%),
radial-gradient(circle at 90% 80%,#dff7ff 0,transparent 35%),
#f6f7fb;
}

button{
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

#nameScreen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at 20% 20%,#dfe3ff,transparent 40%),
radial-gradient(circle at 80% 80%,#d9f7ff,transparent 40%),
#f7f8fc;
z-index:9999;
}

.nameBox{
width:100%;
max-width:390px;
background:rgba(255,255,255,.88);
backdrop-filter:blur(18px);
border-radius:28px;
padding:34px 25px;
text-align:center;
box-shadow:0 20px 60px rgba(70,75,130,.15);
}

.nameBrain{
font-size:55px
}

.nameLogo{
font-size:31px;
font-weight:900;
background:linear-gradient(90deg,#6366f1,#8b5cf6);
-webkit-background-clip:text;
color:transparent;
margin:8px 0 24px;
}

.nameTitle{
font-size:23px;
font-weight:800;
}

.nameDesc{
color:#7b8090;
font-size:14px;
margin:8px 0 20px;
}

#nameInput,
.modalInput{
width:100%;
height:53px;
border:1px solid #dfe2eb;
border-radius:15px;
padding:0 15px;
font-size:16px;
outline:none;
background:#fafbff;
}

.nameContinue,
.newChatBtn{
width:100%;
height:53px;
margin-top:12px;
border:0;
border-radius:15px;
color:white;
font-size:16px;
font-weight:bold;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

#app{
display:none;
height:100vh;
flex-direction:column;
}

.header{
height:68px;
flex-shrink:0;
display:flex;
align-items:center;
padding:0 13px;
background:rgba(255,255,255,.78);
backdrop-filter:blur(18px);
border-bottom:1px solid #ddd;
}

.menuBtn{
width:44px;
height:44px;
border:0;
border-radius:13px;
background:transparent;
font-size:25px;
}

.logo{
margin-left:9px;
font-size:23px;
font-weight:900;
display:flex;
align-items:center;
gap:7px;
}

.logo span,
.sideLogo span,
.welcomeTitle span{
color:#696cf4;
}

.beta{
font-size:10px;
font-weight:900;
letter-spacing:.7px;
padding:4px 7px;
border-radius:7px;
color:#6366f1;
background:#ececff;
border:1px solid #d9d9ff;
}

.status{
margin-left:auto;
display:flex;
align-items:center;
gap:5px;
font-size:11px;
color:#777d8d;
}

.statusDot{
width:7px;
height:7px;
border-radius:50%;
background:#34c759;
}

.statusDot.busy{
background:#f59e0b;
}

.chatWrapper{
flex:1;
overflow-y:auto;
padding:20px 13px 180px;
}

.chat{
max-width:820px;
min-height:100%;
margin:auto;
display:flex;
flex-direction:column;
}

.welcomeCard{
margin:auto;
width:min(600px,94%);
padding:35px 25px;
text-align:center;
border-radius:28px;
background:rgba(255,255,255,.76);
backdrop-filter:blur(15px);
box-shadow:0 15px 50px rgba(80,85,140,.08);
}

.welcomeIcon{
width:70px;
height:70px;
margin:0 auto 16px;
display:flex;
align-items:center;
justify-content:center;
border-radius:22px;
font-size:38px;
background:linear-gradient(135deg,#e6e8ff,#eee8ff);
}

.welcomeTitle{
font-size:25px;
font-weight:900;
margin-bottom:9px;
}

.welcomeText{
color:#777d8d;
line-height:1.6;
font-size:14px;
}

.message{
display:flex;
margin-bottom:18px;
align-items:flex-start;
gap:5px;
}

.message.ai{
justify-content:flex-start;
}

.message.user{
justify-content:flex-end;
}

.messageContent{
max-width:78%;
position:relative;
}

.bubble{
padding:13px 16px;
border-radius:18px;
font-size:16px;
line-height:1.55;
white-space:pre-wrap;
word-break:break-word;
}

.ai .bubble{
background:rgba(255,255,255,.9);
border:1px solid #e3e5ec;
}

.user .bubble{
color:white;
background:linear-gradient(135deg,#6366f1,#805cf5);
}

.messageOptions{
width:31px;
height:31px;
border:0;
border-radius:10px;
background:transparent;
color:#858a99;
font-size:19px;
display:flex;
align-items:center;
justify-content:center;
opacity:.7;
margin-top:7px;
}

.messageOptions:hover{
background:#e9eaf1;
opacity:1;
}

.inputContainer{
position:fixed;
bottom:0;
left:0;
width:100%;
padding:10px 10px 18px;
background:linear-gradient(
transparent,
rgba(246,247,251,.96) 28%
);
z-index:10;
}

.inputBox{
max-width:820px;
min-height:82px;
margin:auto;
display:flex;
align-items:flex-end;
padding:8px;
background:rgba(255,255,255,.94);
backdrop-filter:blur(18px);
border:1px solid #dedfea;
border-radius:22px;
box-shadow:0 10px 35px rgba(60,65,110,.1);
}

textarea{
flex:1;
min-height:62px;
max-height:145px;
resize:none;
border:0;
outline:0;
padding:13px 10px;
font:16px Arial;
background:transparent;
}

.sendBtn{
width:50px;
height:50px;
border:0;
border-radius:15px;
color:white;
font-size:20px;
background:linear-gradient(135deg,#6366f1,#805cf5);
}

.sendBtn:disabled{
opacity:.6;
cursor:not-allowed;
}

.overlay{
position:fixed;
inset:0;
background:rgba(20,22,40,.25);
display:none;
z-index:20;
}

.overlay.active{
display:block;
}

.sidebar{
position:fixed;
top:0;
left:-310px;
width:290px;
height:100vh;
background:rgba(255,255,255,.97);
z-index:30;
transition:.25s;
box-shadow:8px 0 30px #0002;
display:flex;
flex-direction:column;
}

.sidebar.active{
left:0;
}

.sideHeader{
height:68px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid #e7e8ee;
}

.sideLogo{
font-size:21px;
font-weight:900;
display:flex;
align-items:center;
gap:6px;
}

.closeBtn{
width:38px;
height:38px;
border:0;
border-radius:11px;
background:#f0f1f6;
font-size:22px;
}

.newChatBtn{
margin:15px 15px 10px;
height:48px;
width:calc(100% - 30px);
}

.historyTitle{
padding:0 16px 9px;
color:#969aa8;
font-size:12px;
font-weight:bold;
}

.history{
flex:1;
overflow-y:auto;
padding-bottom:5px;
}

.historyItem{
margin:3px 8px;
padding:12px 14px;
border-radius:12px;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.historyItem:hover{
background:#f0f1f6;
}

.emptyHistory{
padding:15px;
color:#999;
}

.logout{
margin:5px 15px 18px;
height:45px;
flex-shrink:0;
border:1px solid #e0e2e8;
background:white;
border-radius:12px;
}

.modal{
position:fixed;
inset:0;
background:#14162859;
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}

.modal.active{
display:flex;
}

.modalBox{
width:100%;
max-width:380px;
background:white;
border-radius:23px;
padding:25px;
}

.modalTitle{
font-size:21px;
font-weight:800;
margin-bottom:8px;
}

.modalDesc{
color:#777d89;
font-size:14px;
margin-bottom:18px;
}

.modalButtons{
display:flex;
gap:9px;
margin-top:12px;
}

.cancelBtn,
.confirmBtn{
flex:1;
height:47px;
border:0;
border-radius:12px;
font-weight:bold;
}

.cancelBtn{
background:#eef0f4;
}

.confirmBtn{
background:#6366f1;
color:white;
}

.actionMenu{
position:fixed;
width:220px;
background:white;
border:1px solid #e0e2e7;
border-radius:15px;
padding:6px;
box-shadow:0 12px 35px #0003;
display:none;
z-index:500;
}

.actionMenu.active{
display:block;
}

.actionBtn{
width:100%;
height:45px;
border:0;
background:white;
border-radius:10px;
text-align:left;
padding:0 13px;
font-size:14px;
}

.actionBtn:hover{
background:#f1f2f6;
}

.deleteBtn{
color:#e53935;
}

.toast{
position:fixed;
left:50%;
bottom:105px;
transform:translateX(-50%) translateY(20px);
background:#20222f;
color:white;
padding:10px 15px;
border-radius:12px;
font-size:14px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:1000;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

/* PWA KURULUM BUTONU */

.installBtn{
position:fixed;
right:14px;
bottom:112px;
z-index:15;
display:none;
align-items:center;
gap:7px;
height:45px;
padding:0 15px;
border:0;
border-radius:14px;
color:white;
font-size:14px;
font-weight:bold;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
box-shadow:0 8px 25px rgba(99,102,241,.3);
}

.installBtn.show{
display:flex;
}

@media(max-width:500px){

.messageContent{
max-width:85%;
}

.bubble{
font-size:15.5px;
}

.logo{
font-size:21px;
}

.beta{
font-size:9px;
padding:3px 6px;
}

.sidebar{
width:285px;
}

.status{
font-size:10px;
}

.installBtn{
right:10px;
bottom:112px;
height:42px;
font-size:13px;
}

}
</style>
</head>

<body>

<div id="nameScreen">

<div class="nameBox">

<div class="nameBrain">🧠</div>

<div class="nameLogo">
BeyinX
</div>

<div class="nameTitle">
İsim koy
</div>

<div class="nameDesc">
BeyinX seni bu isimle tanıyacak.
</div>

<input
id="nameInput"
maxlength="30"
placeholder="İsmini yaz..."
onkeydown="nameEnter(event)"
>

<button
class="nameContinue"
onclick="saveName()">
Devam et
</button>

</div>

</div>


<div id="app">

<header class="header">

<button
class="menuBtn"
onclick="openSidebar()">
☰
</button>

<div class="logo">
🧠 BeyinX
<span class="beta">BETA</span>
</div>

<div class="status">

<span
id="statusDot"
class="statusDot">
</span>

<span id="statusText">
Hazır
</span>

</div>

</header>


<main class="chatWrapper">

<div
id="chat"
class="chat">
</div>

</main>


<div class="inputContainer">

<div class="inputBox">

<textarea
id="messageInput"
placeholder="Mesajını yaz..."
onkeydown="sendEnter(event)"
></textarea>

<button
id="sendBtn"
class="sendBtn"
onclick="sendMessage()">
➤
</button>

</div>

</div>

</div>


<!-- PWA KURULUM -->

<button
id="installBtn"
class="installBtn"
onclick="installBeyinX()">
📲 BeyinX'i yükle
</button>


<div
id="overlay"
class="overlay"
onclick="closeSidebar()">
</div>


<aside
id="sidebar"
class="sidebar">

<div class="sideHeader">

<div class="sideLogo">
🧠 BeyinX
<span class="beta">BETA</span>
</div>

<button
class="closeBtn"
onclick="closeSidebar()">
×
</button>

</div>


<button
class="newChatBtn"
onclick="newChat()">
＋ Yeni sohbet
</button>


<div class="historyTitle">
SOHBETLER
</div>


<div
id="history"
class="history">
</div>


<button
class="logout"
onclick="logout()">
İsmi değiştir / çıkış
</button>

</aside>


<div
id="newChatModal"
class="modal">

<div class="modalBox">

<div class="modalTitle">
Yeni sohbet
</div>

<div class="modalDesc">
Bu sohbete bir isim koy.
</div>

<input
id="newChatInput"
class="modalInput"
maxlength="60"
placeholder="Sohbet adı..."
>

<div class="modalButtons">

<button
class="cancelBtn"
onclick="closeModal('newChatModal')">
İptal
</button>

<button
class="confirmBtn"
onclick="createChat()">
Oluştur
</button>

</div>

</div>

</div>


<div
id="renameModal"
class="modal">

<div class="modalBox">

<div class="modalTitle">
Chatin ismini değiştir
</div>

<div class="modalDesc">
Yeni isim kaydedilecek.
</div>

<input
id="renameInput"
class="modalInput"
maxlength="60"
placeholder="Yeni isim..."
>

<div class="modalButtons">

<button
class="cancelBtn"
onclick="closeModal('renameModal')">
İptal
</button>

<button
class="confirmBtn"
onclick="saveRename()">
Kaydet
</button>

</div>

</div>

</div>


<div
id="actionMenu"
class="actionMenu">

<button
class="actionBtn"
onclick="renameChat()">
✏️ Chatin ismini değiştir
</button>

<button
class="actionBtn deleteBtn"
onclick="deleteChat()">
🗑️ Chati sil
</button>

</div>


<div
id="messageMenu"
class="actionMenu">

<button
class="actionBtn"
onclick="copySelectedMessage()">
📋 Kopyala
</button>

<button
id="regenerateBtn"
class="actionBtn"
onclick="regenerateSelectedMessage()">
🔄 Yeniden oluştur
</button>

<button
id="messageDeleteBtn"
class="actionBtn deleteBtn"
onclick="deleteSelectedMessage()">
🗑️ Sil
</button>

</div>


<div
id="toast"
class="toast">
Tamam ✓
</div>


<script>

let username =
localStorage.getItem("beyinx_username");

let chats =
JSON.parse(
localStorage.getItem("beyinx_chats") || "[]"
);

let currentChat = null;

let selectedChatId = null;

let selectedMessageIndex = null;


/* PWA */

let deferredInstallPrompt = null;


/* AÇILIŞ */

if(username){

document
.getElementById("nameScreen")
.style.display="none";

document
.getElementById("app")
.style.display="flex";

showWelcome();

loadHistory();

}


/* İSİM */

function saveName(){

const name =
document
.getElementById("nameInput")
.value
.trim();

if(!name){

alert("İsmini yaz.");

return;

}

username=name;

localStorage.setItem(
"beyinx_username",
username
);

document
.getElementById("nameScreen")
.style.display="none";

document
.getElementById("app")
.style.display="flex";

showWelcome();

loadHistory();

}


function nameEnter(event){

if(event.key==="Enter"){

event.preventDefault();

saveName();

}

}


/* DURUM */

function setStatus(
text,
busy=false
){

document
.getElementById("statusText")
.textContent=text;

document
.getElementById("statusDot")
.className =
"statusDot" +
(
busy ? " busy" : ""
);

}


/* KARŞILAMA */

function showWelcome(){

const chat =
document.getElementById("chat");

chat.innerHTML="";

const card =
document.createElement("div");

card.className="welcomeCard";

card.innerHTML=`

<div class="welcomeIcon">
🧠
</div>

<div class="welcomeTitle">
Merhaba
<span>
${escapeHTML(username || "")}
</span>
</div>

<div class="welcomeText">
BeyinX burada.<br>
Sohbet, kod, fikir, bilgi ve daha fazlası için yazabilirsin. 🚀
</div>

`;

chat.appendChild(card);

}


/* TOAST */

function showToast(text){

const toast =
document.getElementById("toast");

toast.textContent=text;

toast.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer =
setTimeout(()=>{

toast.classList.remove("show");

},1800);

}


/* MESAJ EKLE */

function addMessage(
text,
type,
messageIndex=null
){

const chat =
document.getElementById("chat");

const message =
document.createElement("div");

message.className =
"message " + type;

const content =
document.createElement("div");

content.className="messageContent";

const bubble =
document.createElement("div");

bubble.className="bubble";

bubble.textContent =
String(text).trim();

content.appendChild(bubble);

const options =
document.createElement("button");

options.className="messageOptions";

options.textContent="⋮";

options.title="Mesaj seçenekleri";

options.onclick=(event)=>{

event.stopPropagation();

showMessageMenu(
messageIndex,
type,
options
);

};

message.appendChild(content);

message.appendChild(options);

chat.appendChild(message);

setTimeout(()=>{

const wrapper =
document.querySelector(
".chatWrapper"
);

wrapper.scrollTop =
wrapper.scrollHeight;

},20);

return bubble;

}


/* MESAJ MENÜSÜ */

function showMessageMenu(
index,
type,
button
){

selectedMessageIndex=index;

const menu =
document.getElementById(
"messageMenu"
);

const rect =
button.getBoundingClientRect();

let left =
rect.left - 185;

let top =
rect.bottom + 6;

if(left < 8){

left=8;

}

if(
left + 220 >
window.innerWidth - 8
){

left =
window.innerWidth - 228;

}

if(
top + 155 >
window.innerHeight - 8
){

top =
rect.top - 160;

}

menu.style.left =
left + "px";

menu.style.top =
top + "px";

document
.getElementById("regenerateBtn")
.style.display =
type === "ai"
? "block"
: "none";

document
.getElementById("messageDeleteBtn")
.style.display =
type === "user"
? "block"
: "none";

menu.classList.add("active");

}


/* MESAJ MENÜSÜ KAPAT */

function closeMessageMenu(){

document
.getElementById("messageMenu")
.classList.remove("active");

selectedMessageIndex=null;

}


/* KOPYALA */

async function copySelectedMessage(){

if(
!currentChat ||
selectedMessageIndex===null
){

return;

}

const message =
currentChat.messages[
selectedMessageIndex
];

if(!message)return;

try{

await navigator.clipboard.writeText(
String(message.text || "")
);

}catch{

const temp =
document.createElement("textarea");

temp.value =
String(message.text || "");

document.body.appendChild(temp);

temp.select();

document.execCommand("copy");

temp.remove();

}

showToast("Kopyalandı ✓");

closeMessageMenu();

}


/* KULLANICI MESAJINI SİL */

function deleteSelectedMessage(){

if(
!currentChat ||
selectedMessageIndex===null
){

return;

}

currentChat.messages.splice(
selectedMessageIndex,
1
);

saveChats();

closeMessageMenu();

renderCurrentChat();

}


/* AI YENİDEN OLUŞTUR */

async function regenerateSelectedMessage(){

if(
!currentChat ||
selectedMessageIndex===null
){

return;

}

const aiIndex =
selectedMessageIndex;

const aiMessage =
currentChat.messages[aiIndex];

if(
!aiMessage ||
aiMessage.role !== "ai"
){

return;

}

currentChat.messages.splice(
aiIndex,
1
);

saveChats();

closeMessageMenu();

renderCurrentChat();

const thinking =
addMessage(
"BeyinX yeniden düşünüyor... 🤔",
"ai",
currentChat.messages.length
);

setStatus(
"Düşünüyor...",
true
);

try{

const data =
await callAI();

const answer =
String(
data?.output_text || ""
).trim();

if(!answer){

throw new Error(
"BeyinX cevap üretmedi."
);

}

thinking.textContent =
answer;

currentChat.messages.push({

role:"ai",

text:answer

});

saveChats();

renderCurrentChat();

setStatus("Hazır");

}catch(error){

thinking.textContent =
localizeError(error);

setStatus("Hazır");

}

}


/* CHAT RENDER */

function renderCurrentChat(){

if(!currentChat){

showWelcome();

return;

}

const chat =
document.getElementById("chat");

chat.innerHTML="";

if(
!currentChat.messages ||
currentChat.messages.length===0
){

showWelcome();

return;

}

currentChat.messages.forEach(
(message,index)=>{

addMessage(
message.text,
message.role,
index
);

}
);

}


/* YENİ CHAT */

function newChat(){

closeSidebar();

document
.getElementById("newChatModal")
.classList.add("active");

document
.getElementById("newChatInput")
.value="";

setTimeout(()=>{

document
.getElementById("newChatInput")
.focus();

},100);

}


function createChat(){

const title =
document
.getElementById("newChatInput")
.value
.trim();

if(!title){

alert("Sohbete bir isim koy.");

return;

}

currentChat={

id:Date.now(),

title:title,

messages:[]

};

chats.unshift(
currentChat
);

saveChats();

closeModal(
"newChatModal"
);

renderCurrentChat();

loadHistory();

}


/* AI ÇAĞRISI */

async function callAI(){

if(!currentChat){

throw new Error(
"Chat bulunamadı."
);

}

const recentMessages =
currentChat.messages.slice(-14);

setStatus(
"Düşünüyor...",
true
);

const response =
await fetch(
"/.netlify/functions/chat",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

messages:
recentMessages

})

}
);

let data={};

try{

data =
await response.json();

}catch{

throw new Error(
"Sunucudan geçersiz cevap geldi."
);

}

if(!response.ok){

throw new Error(
data?.error ||
"BeyinX bağlantı hatası."
);

}

return data;

}


/* MESAJ GÖNDER */

async function sendMessage(){

const input =
document.getElementById(
"messageInput"
);

const sendBtn =
document.getElementById(
"sendBtn"
);

const text =
input.value.trim();

if(!text)return;

if(!currentChat){

currentChat={

id:Date.now(),

title:
text.substring(0,60),

messages:[]

};

chats.unshift(
currentChat
);

saveChats();

loadHistory();

}

const userIndex =
currentChat.messages.length;

currentChat.messages.push({

role:"user",

text:text

});

addMessage(
text,
"user",
userIndex
);

saveChats();

input.value="";

sendBtn.disabled=true;

const thinkingIndex =
currentChat.messages.length;

const thinkingBubble =
addMessage(
"BeyinX düşünüyor... 🤔",
"ai",
thinkingIndex
);

setStatus(
"Düşünüyor...",
true
);

try{

const data =
await callAI();

const answer =
String(
data?.output_text || ""
).trim();

if(!answer){

throw new Error(
"BeyinX cevap üretmedi."
);

}

thinkingBubble.textContent =
answer;

currentChat.messages.push({

role:"ai",

text:answer

});

saveChats();

renderCurrentChat();

setStatus("Hazır");

}catch(error){

thinkingBubble.textContent =
localizeError(error);

setStatus("Hazır");

}

sendBtn.disabled=false;

input.focus();

}


/* HATA ÇEVİRİSİ */

function localizeError(error){

const text =
String(
error?.message || ""
);

if(
/rate limit|429|too many|TPM/i
.test(text)
){

return `
BeyinX şu anda biraz yoğun 😅

Kısa süre bekleyip tekrar dene.
`;

}

if(
/failed to fetch|network|fetch/i
.test(text)
){

return `
BeyinX bağlantısına ulaşılamadı. 🌐

İnternet bağlantını kontrol edip tekrar dene.
`;

}

return `
BeyinX bağlantısında geçici bir sorun oluştu. 🤖

${text || "Biraz sonra tekrar dene."}
`;

}


/* ENTER */

function sendEnter(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}


/* KAYDET */

function saveChats(){

localStorage.setItem(
"beyinx_chats",
JSON.stringify(chats)
);

}


/* GEÇMİŞ */

function loadHistory(){

const history =
document.getElementById(
"history"
);

history.innerHTML="";

if(chats.length===0){

history.innerHTML=`

<div class="emptyHistory">
Henüz sohbet yok.
</div>

`;

return;

}

chats.forEach(chat=>{

const item =
document.createElement("div");

item.className =
"historyItem";

item.textContent =
"💬 " + chat.title;

item.addEventListener(
"click",
()=>{

openChat(chat.id);

}
);

item.addEventListener(
"contextmenu",
event=>{

event.preventDefault();

showActionMenu(
chat.id,
event.clientX,
event.clientY
);

}
);

let timer;

item.addEventListener(
"touchstart",
()=>{

timer =
setTimeout(()=>{

showActionMenu(
chat.id,
20,
120
);

},600);

},
{passive:true}
);

item.addEventListener(
"touchend",
()=>{

clearTimeout(timer);

}
);

history.appendChild(item);

});

}


/* CHAT AÇ */

function openChat(id){

const chat =
chats.find(
c=>c.id===id
);

if(!chat)return;

currentChat=chat;

renderCurrentChat();

closeSidebar();

}


/* CHAT MENÜSÜ */

function showActionMenu(
id,
x,
y
){

selectedChatId=id;

const menu =
document.getElementById(
"actionMenu"
);

menu.style.left =
Math.min(
x,
window.innerWidth-230
)+"px";

menu.style.top =
Math.min(
y,
window.innerHeight-110
)+"px";

menu.classList.add(
"active"
);

}


/* CHAT İSMİ */

function renameChat(){

const chat =
chats.find(
c=>c.id===selectedChatId
);

if(!chat)return;

document
.getElementById("renameInput")
.value =
chat.title;

document
.getElementById("actionMenu")
.classList.remove(
"active"
);

document
.getElementById("renameModal")
.classList.add(
"active"
);

}


function saveRename(){

const name =
document
.getElementById("renameInput")
.value
.trim();

if(!name){

alert("Yeni ismi yaz.");

return;

}

const chat =
chats.find(
c=>c.id===selectedChatId
);

if(!chat)return;

chat.title=name;

saveChats();

closeModal(
"renameModal"
);

selectedChatId=null;

loadHistory();

}


/* CHAT SİL */

function deleteChat(){

if(
selectedChatId===null
){

return;

}

const index =
chats.findIndex(
c=>c.id===selectedChatId
);

if(index===-1)return;

const deletedId =
selectedChatId;

chats.splice(
index,
1
);

saveChats();

if(
currentChat &&
currentChat.id===deletedId
){

currentChat=null;

showWelcome();

}

selectedChatId=null;

document
.getElementById("actionMenu")
.classList.remove(
"active"
);

loadHistory();

}


/* SIDEBAR */

function openSidebar(){

document
.getElementById("sidebar")
.classList.add(
"active"
);

document
.getElementById("overlay")
.classList.add(
"active"
);

loadHistory();

}


function closeSidebar(){

document
.getElementById("sidebar")
.classList.remove(
"active"
);

document
.getElementById("overlay")
.classList.remove(
"active"
);

document
.getElementById("actionMenu")
.classList.remove(
"active"
);

closeMessageMenu();

}


/* MODAL */

function closeModal(id){

document
.getElementById(id)
.classList.remove(
"active"
);

}


/* ÇIKIŞ */

function logout(){

localStorage.removeItem(
"beyinx_username"
);

username=null;

currentChat=null;

document
.getElementById("app")
.style.display="none";

document
.getElementById("nameScreen")
.style.display="flex";

document
.getElementById("nameInput")
.value="";

}


/* GÜVENLİ METİN */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* DIŞARI TIKLAMA */

document.addEventListener(
"click",
event=>{

const menu =
document.getElementById(
"actionMenu"
);

const messageMenu =
document.getElementById(
"messageMenu"
);

if(
menu.classList.contains("active") &&
!menu.contains(event.target)
){

menu.classList.remove("active");

selectedChatId=null;

}

if(
messageMenu.classList.contains("active") &&
!messageMenu.contains(event.target) &&
!event.target.classList.contains("messageOptions")
){

closeMessageMenu();

}

}
);


/* ESC */

document.addEventListener(
"keydown",
event=>{

if(event.key==="Escape"){

closeMessageMenu();

document
.getElementById("actionMenu")
.classList.remove(
"active"
);

}

});

/* PWA KURULUM İSTEMİ */

window.addEventListener(
"beforeinstallprompt",
event=>{

event.preventDefault();

deferredInstallPrompt=event;

const installBtn =
document.getElementById(
"installBtn"
);

installBtn.classList.add("show");

}
);


/* PWA KUR */

async function installBeyinX(){

if(!deferredInstallPrompt){

showToast(
"Kurulum şu anda kullanılamıyor."
);

return;

}

const promptEvent =
deferredInstallPrompt;

deferredInstallPrompt=null;

const installBtn =
document.getElementById(
"installBtn"
);

installBtn.classList.remove("show");

try{

await promptEvent.prompt();

const result =
await promptEvent.userChoice;

if(result.outcome==="accepted"){

showToast(
"BeyinX kuruluyor ✓"
);

}else{

showToast(
"Kurulum iptal edildi."
);

}

}catch(error){

console.error(
"Kurulum hatası:",
error
);

}

}


/* PWA KURULDU */

window.addEventListener(
"appinstalled",
()=>{

deferredInstallPrompt=null;

document
.getElementById("installBtn")
.classList.remove("show");

showToast(
"BeyinX başarıyla kuruldu ✓"
);

}
);


/* ZATEN UYGULAMA OLARAK AÇILDIYSA */

if(
window.matchMedia &&
window.matchMedia(
"(display-mode: standalone)"
).matches
){

console.log(
"BeyinX uygulama modunda çalışıyor."
);

}

</script>
